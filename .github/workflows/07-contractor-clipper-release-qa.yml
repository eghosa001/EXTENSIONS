name: Contractor Clipper Release QA

on:
  pull_request:
    paths:
      - "07-contractor-clipper/**"
      - ".github/workflows/07-contractor-clipper-release-qa.yml"

jobs:
  browser-release-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-contractor-clipper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release-QA browser tooling
        run: |
          npm install --no-save playwright-core@1.55.0
          npx -y playwright@1.55.0 install --with-deps chromium
      - name: Prepare localhost-only QA copy
        run: |
          rm -rf /tmp/contractor-clipper-qa
          mkdir -p /tmp/contractor-clipper-qa
          cp -R . /tmp/contractor-clipper-qa/
          python3 - <<'PY'
          import json
          p = "/tmp/contractor-clipper-qa/manifest.json"
          with open(p, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["host_permissions"] = ["http://127.0.0.1/*"]
          with open(p, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
      - name: Run headed extension release QA
        env:
          CC_EXTENSION_DIR: /tmp/contractor-clipper-qa
        run: xvfb-run -a node tests/browser-release.cjs
      - name: Build clean Web Store ZIP
        run: |
          rm -rf release
          mkdir -p release/package
          cp manifest.json background.js popup.html popup.css popup.js quote.html quote.css quote.js release/package/
          cp -R lib release/package/lib
          cp -R assets release/package/assets
          (cd release/package && zip -r ../contractor-clipper-v0.3.0.zip .)
          unzip -t release/contractor-clipper-v0.3.0.zip
      - name: Verify required screenshot dimensions
        run: |
          python3 - <<'PY'
          import struct
          p = "qa-artifacts/store-screenshot-quote-1280x800.png"
          with open(p, "rb") as f:
              header = f.read(24)
          assert header[:8] == b"\\x89PNG\\r\\n\\x1a\\n", "not a PNG"
          size = struct.unpack(">II", header[16:24])
          assert size == (1280, 800), size
          print("Store screenshot:", size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: contractor-clipper-v0.3.0-release-qa
          path: |
            07-contractor-clipper/qa-artifacts/**
            07-contractor-clipper/release/contractor-clipper-v0.3.0.zip
          if-no-files-found: error
