name: Product 01 checks

on:
  push:
    paths:
      - "01-procurasheet/**"
      - ".github/workflows/01-shopify-po.yml"
  pull_request:
    paths:
      - "01-procurasheet/**"

jobs:
  test-product-01:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-procurasheet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Package Chrome Web Store ZIP
        run: zip -r procurasheet-v1.0.0.zip manifest.json popup.html popup.js index.html styles.css app.js lib assets samples
      - uses: actions/upload-artifact@v4
        with:
          name: procurasheet-v1.0.0
          path: 01-procurasheet/procurasheet-v1.0.0.zip
          if-no-files-found: error
