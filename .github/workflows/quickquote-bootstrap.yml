name: QuickQuote Cloudflare bootstrap
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/quickquote-bootstrap.yml
      - bots/quickquote-pro/scripts/bootstrap-cloudflare.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUICKQUOTE_BOT_TOKEN: ${{ secrets.QUICKQUOTE_BOT_TOKEN }}
      QUICKQUOTE_SUPPORT_CHAT_ID: ${{ secrets.QUICKQUOTE_SUPPORT_CHAT_ID }}
    steps:
      - id: guard
        name: Check credentials without revealing secret values
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID QUICKQUOTE_BOT_TOKEN QUICKQUOTE_SUPPORT_CHAT_ID; do
            if [ -z "${!key}" ]; then
              echo "::warning::QuickQuote blocked: missing GitHub Actions secret $key"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo "No Cloudflare resources changed. Add the missing secrets then rerun."
          fi

  deploy:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUICKQUOTE_BOT_TOKEN: ${{ secrets.QUICKQUOTE_BOT_TOKEN }}
      QUICKQUOTE_WEBHOOK_SECRET: ${{ secrets.QUICKQUOTE_WEBHOOK_SECRET }}
      QUICKQUOTE_SUPPORT_CHAT_ID: ${{ secrets.QUICKQUOTE_SUPPORT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused source checks
        run: |
          node --check bots/quickquote-pro/worker.mjs
          node --check bots/quickquote-pro/scripts/bootstrap-cloudflare.mjs
          node --check bots/quickquote-pro/scripts/register-bot.mjs
          node --test bots/quickquote-pro/test.mjs bots/quickquote-pro/integration.test.mjs
      - name: Validate credentials and prepare webhook secret
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Cloudflare account ID must contain 32 hexadecimal characters"
            exit 1
          fi
          if ! [[ "$QUICKQUOTE_SUPPORT_CHAT_ID" =~ ^[0-9]{1,18}$ ]]; then
            echo "::error::QUICKQUOTE_SUPPORT_CHAT_ID must be your numeric Telegram user ID"
            exit 1
          fi
          if [ -n "$QUICKQUOTE_WEBHOOK_SECRET" ]; then
            if ! [[ "$QUICKQUOTE_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{32,256}$ ]]; then
              echo "::error::Invalid webhook secret format"
              exit 1
            fi
          else
            secret="$(node -e 'process.stdout.write(require("crypto").randomBytes(48).toString("base64url"))')"
            echo "::add-mask::$secret"
            echo "QUICKQUOTE_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
          fi
      - name: Find or create Cloudflare D1 database and worker address
        run: node bots/quickquote-pro/scripts/bootstrap-cloudflare.mjs
      - name: Deploy Worker with paid purchases disabled
        working-directory: bots/quickquote-pro
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@4
          wrangler d1 execute quickquote-pro --remote --file=./schema.sql
          wrangler deploy
          printf '%s' "$QUICKQUOTE_BOT_TOKEN" | wrangler secret put BOT_TOKEN
          printf '%s' "$QUICKQUOTE_WEBHOOK_SECRET" | wrangler secret put WEBHOOK_SECRET
          printf '%s' "$QUICKQUOTE_SUPPORT_CHAT_ID" | wrangler secret put SUPPORT_CHAT_ID
      - name: Health check and Telegram webhook registration
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "$QUICKQUOTE_WORKER_URL/health"
          node bots/quickquote-pro/scripts/register-bot.mjs
          echo "QuickQuote free-only backend deployed; real user flow and paid testing remain."
