<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contractor Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">CONTRACTOR CLIPPER</p>
        <h1>Clip to quote</h1>
      </div>
      <button id="openQuotes" class="ghost" type="button">Quotes</button>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">Ready to scan this page.</div>

    <button id="scan" class="primary wide" type="button">Scan current product</button>

    <section id="editor" class="editor hidden" aria-label="Clipped product editor">
      <div class="preview">
        <img id="imagePreview" alt="Product preview" />
        <div>
          <label>Product name<input id="title" autocomplete="off" /></label>
          <label>SKU<input id="sku" placeholder="Optional" autocomplete="off" /></label>
        </div>
      </div>

      <div class="grid two">
        <label>Cost<input id="cost" type="number" min="0" step="0.01" inputmode="decimal" /></label>
        <label>Currency<input id="currency" maxlength="3" placeholder="USD" autocomplete="off" /></label>
      </div>

      <label>Supplier<input id="supplier" list="supplierOptions" placeholder="Supplier name" autocomplete="off" /></label>
      <datalist id="supplierOptions"></datalist>

      <div class="grid two">
        <label>Room / area<input id="room" placeholder="Kitchen, lobby…" autocomplete="off" /></label>
        <label>Category<input id="category" placeholder="Tile, lighting…" autocomplete="off" /></label>
      </div>
      <div class="grid two">
        <label>Quantity<input id="qty" type="number" min="1" step="1" value="1" /></label>
        <label>Markup %<input id="markup" type="number" min="0" step="0.1" value="20" /></label>
      </div>
      <div class="grid two">
        <label>Delivery<input id="delivery" type="number" min="0" step="0.01" value="0" /></label>
        <label>Project<select id="project"></select></label>
      </div>

      <input id="url" type="hidden" />
      <input id="image" type="hidden" />
      <input id="host" type="hidden" />

      <button id="save" class="primary wide" type="button">Add to quote</button>
    </section>

    <footer>Local-first workspace · product and quote data stay in this browser.</footer>
  </main>

  <script src="lib/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
