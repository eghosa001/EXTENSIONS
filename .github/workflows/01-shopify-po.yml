name: Product 01 checks

on:
  push:
    paths:
      - "01-procurasheet/**"
      - ".github/workflows/01-shopify-po.yml"
  pull_request:
    paths:
      - "01-procurasheet/**"
      - ".github/workflows/01-shopify-po.yml"

jobs:
  test-product-01:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-procurasheet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Read release version
        id: release
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package all browser builds
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          rm -rf release
          mkdir -p release
          for browser in chrome edge opera firefox safari; do
            case "$browser" in
              chrome) label="Chrome" ;;
              edge) label="Edge" ;;
              opera) label="Opera" ;;
              firefox) label="Firefox" ;;
              safari) label="Safari-WebExtension" ;;
            esac
            (cd "dist/$browser" && zip -qr "../../release/ProcuraSheet-${label}-v${VERSION}.zip" .)
          done
      - name: Verify browser release packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -f "release/ProcuraSheet-Chrome-v${VERSION}.zip"
          test -f "release/ProcuraSheet-Edge-v${VERSION}.zip"
          test -f "release/ProcuraSheet-Opera-v${VERSION}.zip"
          test -f "release/ProcuraSheet-Firefox-v${VERSION}.zip"
          test -f "release/ProcuraSheet-Safari-WebExtension-v${VERSION}.zip"
          for archive in release/*.zip; do
            unzip -l "$archive" > release-files.txt
            grep -q "manifest.json" release-files.txt
            ! grep -q "billing/" release-files.txt
            ! grep -q "tests/" release-files.txt
            ! grep -q "scripts/" release-files.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: procurasheet-v${{ steps.release.outputs.version }}-cross-browser
          path: 01-procurasheet/release/*.zip
          if-no-files-found: error
