name: ProcuraSheet Live Checkout Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/01-procurasheet-live-checkout-smoke.yml"

jobs:
  live-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Pro checkout redirects to Paystack
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' \
            -X POST 'https://procurasheet-billing.onrender.com/billing/start' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'plan=pro&email=procurasheet-smoke%40example.com')"
          test "$status" = "303"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); print substr($0,11)}' "$headers" | tail -n1 | xargs)"
          [[ "$location" == https://checkout.paystack.com/* ]]
          echo "Live checkout returned a Paystack authorization URL."
