name: Product 01 checks

on:
  push:
    paths:
      - "01-procurasheet/**"
      - ".github/workflows/01-shopify-po.yml"
  pull_request:
    paths:
      - "01-procurasheet/**"
      - ".github/workflows/01-shopify-po.yml"

jobs:
  test-product-01:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-procurasheet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Package Chrome Web Store ZIP
        run: zip -r procurasheet-v1.1.2.zip manifest.json popup.html popup.js index.html styles.css app.js lib assets samples
      - name: Verify release ZIP excludes server and tests
        run: |
          unzip -l procurasheet-v1.1.2.zip > release-files.txt
          ! grep -q "billing/" release-files.txt
          ! grep -q "tests/" release-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: procurasheet-v1.1.2
          path: 01-procurasheet/procurasheet-v1.1.2.zip
          if-no-files-found: error
