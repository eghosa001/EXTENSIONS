name: QuickQuote controlled deployment
on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: HTTPS Worker origin (e.g. https://quickquote-pro.YOURSUBDOMAIN.workers.dev/)
        required: true
        type: string
      enable_paid_features:
        description: Enable Stars purchases only after full live payment testing
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      QUICKQUOTE_BOT_TOKEN: ${{ secrets.QUICKQUOTE_BOT_TOKEN }}
      QUICKQUOTE_WEBHOOK_SECRET: ${{ secrets.QUICKQUOTE_WEBHOOK_SECRET }}
      QUICKQUOTE_SUPPORT_CHAT_ID: ${{ secrets.QUICKQUOTE_SUPPORT_CHAT_ID }}
      QUICKQUOTE_WORKER_URL: ${{ inputs.worker_url }}
      ENABLE_PAYMENTS: ${{ inputs.enable_paid_features }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused tests and check secrets
        shell: bash
        run: |
          set -euo pipefail
          node --check bots/quickquote-pro/worker.mjs
          node --test bots/quickquote-pro/test.mjs bots/quickquote-pro/integration.test.mjs
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID QUICKQUOTE_BOT_TOKEN QUICKQUOTE_WEBHOOK_SECRET QUICKQUOTE_SUPPORT_CHAT_ID; do
            if [ -z "${!key}" ]; then echo "Missing GitHub secret: $key"; exit 1; fi
          done
          if ! [[ "$QUICKQUOTE_SUPPORT_CHAT_ID" =~ ^[0-9]+$ ]]; then echo "Support chat ID must be numeric"; exit 1; fi
      - name: Create runtime configuration and deploy
        working-directory: bots/quickquote-pro
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@4
          cp wrangler.toml.example wrangler.toml
          node -e "const fs=require('fs');const p='wrangler.toml';let s=fs.readFileSync(p,'utf8').replace('REPLACE_WITH_REAL_D1_DATABASE_ID',process.env.CLOUDFLARE_D1_DATABASE_ID);if(process.env.ENABLE_PAYMENTS==='true')s=s.replace('PAYMENTS_ENABLED = \"false\"','PAYMENTS_ENABLED = \"true\"');fs.writeFileSync(p,s)"
          wrangler d1 execute quickquote-pro --remote --file=./schema.sql
          wrangler deploy
          printf '%s' "$QUICKQUOTE_BOT_TOKEN" | wrangler secret put BOT_TOKEN
          printf '%s' "$QUICKQUOTE_WEBHOOK_SECRET" | wrangler secret put WEBHOOK_SECRET
          printf '%s' "$QUICKQUOTE_SUPPORT_CHAT_ID" | wrangler secret put SUPPORT_CHAT_ID
      - name: Verify Worker and register bot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${QUICKQUOTE_WORKER_URL%/}/health"
          node bots/quickquote-pro/scripts/register-bot.mjs
          echo "Bot deployed and registered."
